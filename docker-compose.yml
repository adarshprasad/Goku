services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tavaru
      POSTGRES_PASSWORD: tavaru
      POSTGRES_DB: tavaru
    ports:
      - "5432:5432"
    volumes:
      - tavaru_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavaru"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tavaru_pg:
